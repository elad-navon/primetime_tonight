<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מה יש בפריים טיים?</title>
<style>
  :root{
    --bg:#0a0d16;
    --bg2:#121729;
    --card:rgba(255,255,255,.045);
    --card-hi:rgba(255,255,255,.075);
    --line:rgba(255,255,255,.10);
    --txt:#eef1f8;
    --dim:#9aa3bd;
    --dimmer:#6c7590;
    --live:#ff4d6d;
    --ok:#3ddc97;
    --radius:18px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(1100px 600px at 85% -10%, #1d2a55 0%, transparent 60%),
      radial-gradient(900px 500px at 5% 0%, #37204d 0%, transparent 55%),
      linear-gradient(180deg,var(--bg) 0%, var(--bg2) 100%);
    background-attachment:fixed;
    color:var(--txt);
    font-family:"Segoe UI Variable Text","Segoe UI",Rubik,Arial,"Noto Sans Hebrew",sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1220px;margin:0 auto;padding:28px 20px 70px}

  /* ---------- header ---------- */
  header{display:flex;flex-wrap:wrap;align-items:flex-end;gap:18px;margin-bottom:26px}
  h1{font-size:clamp(26px,4vw,40px);margin:0;letter-spacing:-.5px;line-height:1.15}
  h1 .glow{background:linear-gradient(90deg,#ffb86b,#ff6b9d 55%,#8f7bff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--dim);font-size:15px;margin-top:8px}
  .clock{margin-inline-start:auto;text-align:center;background:var(--card);border:1px solid var(--line);
         border-radius:14px;padding:10px 18px;backdrop-filter:blur(8px)}
  .clock b{display:block;font-size:26px;font-variant-numeric:tabular-nums;letter-spacing:1px}
  .clock span{font-size:11px;color:var(--dimmer);letter-spacing:.5px}

  /* ---------- toolbar ---------- */
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 22px}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--dim);border-radius:999px;
        padding:7px 15px;font-size:13.5px;cursor:pointer;transition:.18s;font-family:inherit}
  .chip:hover{background:var(--card-hi);color:var(--txt)}
  .chip.on{background:#fff;color:#0d1020;border-color:#fff;font-weight:600}
  .spacer{flex:1}
  .ghost{border:1px solid var(--line);background:transparent;color:var(--dim);border-radius:10px;
         padding:7px 13px;font-size:13px;cursor:pointer;font-family:inherit}
  .ghost:hover{color:var(--txt);border-color:rgba(255,255,255,.3)}

  /* ---------- sections ---------- */
  .sec-head{display:flex;align-items:center;gap:12px;margin:34px 0 16px}
  .sec-head h2{font-size:20px;margin:0;white-space:nowrap}
  .sec-head .badge{font-size:12px;color:var(--dimmer);border:1px solid var(--line);
                   border-radius:999px;padding:3px 10px}
  .sec-head .rule{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}

  /* ---------- prime cards ---------- */
  /* align-items:start – כרטיס נפתח לא "מותח" את שכניו בשורה */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(370px,1fr));gap:18px;align-items:start}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
        overflow:hidden;backdrop-filter:blur(10px);transition:.25s;position:relative;
        display:flex;flex-direction:column}
  .card>*{flex:none}   /* בלי זה ה‑flex מכווץ את התוכן שנפתח בחזרה לאפס */
  .card:hover{background:var(--card-hi);transform:translateY(-3px);border-color:rgba(255,255,255,.22);
              box-shadow:0 18px 40px -22px rgba(0,0,0,.9)}
  .card::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:3px;
                background:var(--acc);z-index:3}
  .ch{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
  .num{min-width:34px;height:34px;display:grid;place-items:center;border-radius:10px;
       font-weight:700;font-size:15px;color:#0b0e18;background:var(--acc);font-variant-numeric:tabular-nums}
  .ch-name{font-weight:600;font-size:15px}
  .ch-meta{margin-inline-start:auto;font-size:11.5px;color:var(--dimmer)}

  /* התוכנית הראשונה – באנר רחב 16:9 */
  .hero{position:relative;aspect-ratio:16/9;background:#161b2e;overflow:hidden;flex:none}
  .hero img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
  .card:hover .hero img{transform:scale(1.045)}
  .hero.noimg::after{content:"📺";position:absolute;inset:0;display:grid;place-items:center;
                     font-size:40px;opacity:.25}
  .scrim{position:absolute;inset:0;background:linear-gradient(0deg,
          rgba(8,10,18,.96) 0%, rgba(8,10,18,.78) 26%, rgba(8,10,18,.18) 58%, transparent 82%)}
  .hero-txt{position:absolute;inset-inline:0;bottom:0;padding:0 18px 15px}
  .hero-txt .title{font-size:19px;text-shadow:0 2px 14px rgba(0,0,0,.7)}
  .hero .tag{position:absolute;top:11px;inset-inline-start:11px;z-index:2}
  .hero .bar{position:absolute;inset-inline:0;bottom:0;margin:0;height:3px;border-radius:0}

  /* שאר התוכניות – שורה עם תמונה רחבה */
  .show{display:flex;gap:13px;padding:13px 16px;align-items:flex-start;
        border-top:1px solid rgba(255,255,255,.06)}
  .thumb{width:124px;aspect-ratio:16/9;flex:none;border-radius:11px;object-fit:cover;
         background:#161b2e;border:1px solid var(--line);display:block}
  .thumb.ph{display:grid;place-items:center;font-size:24px;opacity:.35}
  .info{min-width:0;flex:1}
  .t-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
  .time{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums;letter-spacing:.3px}
  .hero-txt .time{color:#dbe2f5}
  .title{font-size:15.5px;font-weight:600;line-height:1.32;margin:0;
         overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical}
  /* ---------- תקציר + "קרא עוד" ---------- */
  .desc-block{margin-top:7px}
  .desc-block.hero-d{padding:13px 16px 14px;margin:0}
  .desc-txt{margin:0;font-size:12.5px;color:var(--dim);line-height:1.55;
            overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical}
  .desc-txt.open{display:block;-webkit-line-clamp:unset;line-clamp:unset;color:#c8d0e6}
  /* העברת תוכנית לספוטלייט (הבאנר העליון) */
  .spot{margin-inline-start:auto;background:rgba(255,255,255,.06);border:1px solid var(--line);
        color:var(--dim);font:inherit;font-size:11px;font-weight:600;padding:3.5px 10px;
        border-radius:999px;cursor:pointer;transition:.18s;white-space:nowrap}
  .spot:hover{background:var(--acc);border-color:var(--acc);color:#0b0e18}
  .hero .tag.spotted{background:rgba(10,13,22,.72);border:1px solid rgba(255,255,255,.22);
                     color:#fff;backdrop-filter:blur(6px)}

  .read-more{display:none;background:none;border:0;padding:5px 0 0;margin:0;cursor:pointer;
             font:inherit;font-size:12px;font-weight:600;color:var(--acc);opacity:.9}
  .read-more.show{display:block}
  .read-more:hover{opacity:1;text-decoration:underline}

  /* ---------- פתיחת שאר התוכניות ---------- */
  .extra{display:grid;grid-template-rows:0fr;transition:grid-template-rows .34s ease}
  .card.open .extra{grid-template-rows:1fr}
  .extra-in{overflow:hidden;min-height:0}
  .more-toggle{width:100%;margin-top:auto;background:transparent;border:0;
               border-top:1px solid rgba(255,255,255,.07);color:var(--dim);font:inherit;
               font-size:12.5px;font-weight:600;padding:11px 10px;cursor:pointer;
               display:flex;align-items:center;justify-content:center;gap:7px;transition:.18s}
  .more-toggle:hover{background:rgba(255,255,255,.06);color:var(--txt)}
  .chev{font-size:9px;opacity:.75;transition:transform .3s ease}
  .card.open .chev{transform:rotate(180deg)}
  .pill{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.4px;white-space:nowrap}
  .pill.live{background:var(--live);color:#fff;box-shadow:0 3px 14px rgba(255,77,109,.45);animation:pulse 2s infinite}
  .pill.next{background:rgba(61,220,151,.16);color:var(--ok);border:1px solid rgba(61,220,151,.3)}
  .pill.done{background:rgba(255,255,255,.09);color:var(--dimmer)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
  .bar{height:3px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:9px}
  .bar i{display:block;height:100%;background:var(--live);border-radius:99px;transition:width .6s}
  .show.done .thumb, .show.done .info{opacity:.5}

  /* ---------- evening panels ---------- */
  .panels{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .panel .ch{padding:10px 14px}
  .row{display:flex;gap:10px;align-items:baseline;padding:8px 14px;font-size:13.5px;
       border-top:1px solid rgba(255,255,255,.05)}
  .row .time{flex:none;width:52px;color:var(--dimmer)}
  .row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#dfe4f2}
  .row.now{background:rgba(255,77,109,.10)}
  .row.now .nm{font-weight:600;color:#fff}
  .row.past{opacity:.42}
  .empty{padding:16px;color:var(--dimmer);font-size:13px;text-align:center}

  .note{margin-top:40px;color:var(--dimmer);font-size:12px;text-align:center;line-height:1.7}
  .err{background:rgba(255,77,109,.12);border:1px solid rgba(255,77,109,.35);color:#ffc2ce;
       padding:14px 18px;border-radius:14px;font-size:14px;margin-bottom:18px}
  .skel{height:150px;border-radius:var(--radius);background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.09),rgba(255,255,255,.04));
        background-size:200% 100%;animation:sh 1.3s infinite}
  @keyframes sh{0%{background-position:100% 0}100%{background-position:-100% 0}}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>מה יש הערב ב<span class="glow">פריים טיים</span>?</h1>
      <div class="sub" id="subtitle">טוען לוח שידורים…</div>
    </div>
    <div class="clock"><b id="clock">--:--</b><span>שעון ישראל</span></div>
  </header>

  <div class="toolbar">
    <button class="chip on" data-filter="all">הכל</button>
    <button class="chip" data-filter="main">ערוצים 11 · 12 · 13</button>
    <button class="chip" data-filter="sport">ספורט 55–60</button>
    <span class="spacer"></span>
    <button class="ghost" id="newsToggle">הצג גם חדשות</button>
    <button class="ghost" id="refresh">רענון</button>
  </div>

  <div id="error"></div>

  <div class="sec-head">
    <h2>פריים טיים</h2>
    <span class="badge" id="primeRange">21:00 – 23:00</span>
    <div class="rule"></div>
  </div>
  <div class="grid" id="prime">
    <div class="skel"></div><div class="skel"></div><div class="skel"></div>
  </div>

  <div class="sec-head">
    <h2>מכאן ועד חצות</h2>
    <span class="badge" id="restRange"></span>
    <div class="rule"></div>
  </div>
  <div class="panels" id="rest"></div>

  <div class="note">
    הנתונים נמשכים בזמן אמת מלוח השידורים של yes · שעות לפי אזור הזמן <b>Asia/Jerusalem</b><br>
    הדף מתרענן אוטומטית כל 5 דקות.
  </div>
</div>

<script>
/* ===== ערוצים ===== */
const CHANNELS = [
  { num:11, id:'CH30', name:'כאן 11',            group:'main',  acc:'#4ec9ff' },
  { num:12, id:'CH34', name:'קשת 12',            group:'main',  acc:'#ff8b5e' },
  { num:13, id:'CH36', name:'רשת 13',            group:'main',  acc:'#c78bff' },
  { num:55, id:'PT26', name:'ספורט 5',           group:'sport', acc:'#3ddc97' },
  { num:56, id:'CH54', name:'ספורט 5+',          group:'sport', acc:'#39c9c1' },
  { num:57, id:'MU03', name:'ספורט 5 גולד',      group:'sport', acc:'#ffd166' },
  { num:58, id:'PT62', name:'ספורט 5 לייב',      group:'sport', acc:'#7ee081' },
  { num:59, id:'CH56', name:'ספורט 5 סטארס',     group:'sport', acc:'#8fd6ff' },
  { num:60, id:'CN49', name:'ספורט 5 מקס',       group:'sport', acc:'#b6e36b' },
];

const API = 'https://svc.yes.co.il/api/content/broadcast-schedule/channels/';
const TZ  = 'Asia/Jerusalem';
const PRIME_FROM = 21*60, PRIME_TO = 23*60;   // דקות מחצות

/* ===== עזרי זמן (תמיד לפי שעון ישראל, לא משנה איפה המחשב) ===== */
const partsFmt = new Intl.DateTimeFormat('en-GB',{timeZone:TZ,year:'numeric',month:'2-digit',
  day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});

function ilParts(date){
  const p={};
  for(const {type,value} of partsFmt.formatToParts(date)) p[type]=value;
  let h = +p.hour; if(h===24) h=0;
  return {y:+p.year, mo:+p.month, d:+p.day, h, mi:+p.minute};
}
function ilOffset(date){                       // הפרש ישראל‑UTC במילישניות
  const p = ilParts(date);
  return Date.UTC(p.y,p.mo-1,p.d,p.h,p.mi) - Math.floor(date.getTime()/60000)*60000;
}
function ilToDate(y,mo,d,h,mi){                // שעה ישראלית -> Date אמיתי
  const guess = Date.UTC(y,mo-1,d,h,mi);
  return new Date(guess - ilOffset(new Date(guess)));
}
const hhmm = d => { const p=ilParts(d); return String(p.h).padStart(2,'0')+':'+String(p.mi).padStart(2,'0'); };

/* ===== שליפה ===== */
async function fetchChannel(ch, dateStr){
  const url = `${API}${ch.id}?date=${dateStr}&ignorePastItems=false`;
  const res = await fetch(url,{headers:{'accept-language':'he-IL'}});
  if(!res.ok) throw new Error(ch.name+': HTTP '+res.status);
  const data = await res.json();
  return (data.items||[]).map(it=>({
    title: it.title || 'ללא שם',
    desc:  it.description || '',
    img:   it.imageUrl || '',
    start: new Date(it.starts),
    end:   new Date(it.ends),
  })).sort((a,b)=>a.start-b.start);
}

/* ===== רינדור ===== */
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* מהדורות ומבזקי חדשות – מוסתרים כברירת מחדל */
const NEWS_RX = /חדשות|מהדור[הת]|מבזק|כותרות הבוקר/;
const isNews  = p => NEWS_RX.test(p.title);

let filter='all', showNews=false, state=[], todayEnd=null, primeStart=null, primeEnd=null;
/* מה פתוח כרגע – נשמר כדי שרענון התצוגה כל דקה לא יסגור מה שהמשתמש פתח */
const openCards = new Set(), openDescs = new Set();
/* איזו תוכנית נבחרה לספוטלייט בכל ערוץ (ברירת מחדל: הראשונה) */
const spotlight = new Map();
const noNews = arr => showNews ? arr : arr.filter(p => !isNews(p));

function statusOf(p, now){
  if(p.end <= now) return 'done';
  if(p.start <= now) return 'live';
  return 'next';
}
function pill(st){
  if(st==='live') return '<span class="pill live">משודר עכשיו</span>';
  if(st==='done') return '<span class="pill done">הסתיים</span>';
  return '';
}
function progress(p, now){
  const pct = (now - p.start) / (p.end - p.start) * 100;
  return `<div class="bar"><i style="width:${Math.min(100,Math.max(0,pct)).toFixed(1)}%"></i></div>`;
}
const ICON = ch => ch.group==='sport' ? '🏆' : '📺';

/* תמונה רחבה 16:9 – ללא חיתוך. נופל לאייקון אם התמונה לא נטענת */
function img(p, ch, cls){
  if(!p.img) return `<div class="${cls} ph">${ICON(ch)}</div>`;
  const fallback = cls==='hero'
    ? `this.parentNode.classList.add('noimg');this.remove()`
    : `this.replaceWith(Object.assign(document.createElement('div'),{className:'thumb ph',textContent:'${ICON(ch)}'}))`;
  return `<img ${cls==='hero'?'':`class="${cls}"`} src="${esc(p.img)}" alt="" loading="lazy" onerror="${fallback}">`;
}

const keyOf = (p, ch) => `${ch.num}-${p.start.getTime()}`;

/* תקציר מקוצר ל‑2 שורות; כפתור "קרא עוד" מוצג רק אם הטקסט באמת נחתך */
function descBlock(p, ch, hero){
  if(!p.desc) return '';
  const k = keyOf(p, ch);
  return `<div class="desc-block${hero?' hero-d':''}">
      <p class="desc-txt" data-k="${k}">${esc(p.desc)}</p>
      <button class="read-more" data-k="${k}">קרא עוד</button>
    </div>`;
}

function hero(p, ch, now, moved){
  const st = statusOf(p, now);
  const tag = st!=='next' ? `<span class="tag">${pill(st)}</span>`
            : moved      ? `<span class="tag spotted pill">בספוטלייט</span>` : '';
  return `<div class="hero">
      ${img(p, ch, 'hero')}
      <div class="scrim"></div>
      ${tag}
      <div class="hero-txt">
        <div class="t-row"><span class="time">${hhmm(p.start)} – ${hhmm(p.end)}</span></div>
        <h3 class="title">${esc(p.title)}</h3>
      </div>
      ${st==='live' ? progress(p, now) : ''}
    </div>
    ${descBlock(p, ch, true)}`;
}

function row(p, ch, now){
  const st = statusOf(p, now);
  return `<div class="show ${st==='done'?'done':''}">
      ${img(p, ch, 'thumb')}
      <div class="info">
        <div class="t-row">
          <span class="time">${hhmm(p.start)} – ${hhmm(p.end)}</span>
          ${pill(st)}
          <button class="spot" data-ch="${ch.num}" data-k="${keyOf(p, ch)}"
                  title="הצג תוכנית זו בראש הכרטיס">לספוטלייט ↑</button>
        </div>
        <h3 class="title">${esc(p.title)}</h3>
        ${st==='live' ? progress(p, now) : ''}
        ${descBlock(p, ch, false)}
      </div>
    </div>`;
}

function renderPrime(now){
  const box = document.getElementById('prime');
  const list = state.filter(c => filter==='all' || c.ch.group===filter);
  let html='';
  for(const {ch, shows, error} of list){
    const inPrime = noNews(shows.filter(p => p.start < primeEnd && p.end > primeStart));
    let body;
    if(error){
      body = `<div class="empty">לא הצלחתי לטעון את הערוץ הזה</div>`;
    }else if(!inPrime.length){
      body = `<div class="empty">אין מידע על שידורים בשעות אלו</div>`;
    }else{
      const chosen = spotlight.get(String(ch.num));
      let i = chosen ? inPrime.findIndex(p => keyOf(p, ch) === chosen) : 0;
      if(i < 0) i = 0;                                   // הבחירה כבר לא בלוח – חזרה לראשונה
      const others = inPrime.filter((_, j) => j !== i);  // השאר נשארים לפי סדר השעות
      body = hero(inPrime[i], ch, now, i > 0);
      if(others.length){
        const label = others.length===1 ? 'עוד תוכנית אחת' : `עוד ${others.length} תוכניות`;
        body += `<div class="extra"><div class="extra-in">${others.map(p => row(p, ch, now)).join('')}</div></div>
          <button class="more-toggle" data-ch="${ch.num}" data-label="${label}">
            <span class="lbl">${label}</span><span class="chev">▼</span>
          </button>`;
      }
    }
    html += `<article class="card" data-ch="${ch.num}" style="--acc:${ch.acc}">
      <div class="ch">
        <span class="num">${ch.num}</span>
        <span class="ch-name">${esc(ch.name)}</span>
        <span class="ch-meta">${inPrime.length?inPrime.length+' שידורים':'—'}</span>
      </div>${body}
    </article>`;
  }
  box.innerHTML = html || `<div class="empty">אין ערוצים לתצוגה</div>`;
  applyState();
}

/* מחזיר לקדמותם כרטיסים ותקצירים שהמשתמש פתח, ומחליט למי מגיע כפתור "קרא עוד" */
function applyState(){
  const box = document.getElementById('prime');
  box.querySelectorAll('.card[data-ch]').forEach(card=>{
    if(!openCards.has(card.dataset.ch)) return;
    card.classList.add('open');
    const lbl = card.querySelector('.more-toggle .lbl');
    if(lbl) lbl.textContent = 'הסתר';
  });
  box.querySelectorAll('.desc-txt').forEach(txt=>{
    const btn = txt.nextElementSibling;
    if(!btn) return;
    const isOpen  = openDescs.has(txt.dataset.k);
    const clipped = txt.scrollHeight > txt.clientHeight + 2;   // נמדד במצב מקוצר
    if(!clipped && !isOpen) return;
    btn.classList.add('show');
    if(isOpen){ txt.classList.add('open'); btn.textContent = 'הצג פחות'; }
  });
}

function renderRest(now){
  const box = document.getElementById('rest');
  const list = state.filter(c => filter==='all' || c.ch.group===filter);
  let html='';
  for(const {ch, shows, error} of list){
    const upcoming = noNews(shows.filter(p => p.end > now && p.start.getTime() < todayEnd));
    const rows = upcoming.map(p=>{
      const live = p.start <= now && p.end > now;
      return `<div class="row ${live?'now':''}">
        <span class="time">${hhmm(p.start)}</span>
        <span class="nm">${esc(p.title)}</span>
        ${live?'<span class="pill live">עכשיו</span>':''}
      </div>`;
    }).join('');
    html += `<section class="panel" style="--acc:${ch.acc}">
      <div class="ch">
        <span class="num">${ch.num}</span>
        <span class="ch-name">${esc(ch.name)}</span>
        <span class="ch-meta">${upcoming.length} עד חצות</span>
      </div>
      ${error ? '<div class="empty">שגיאת טעינה</div>' : (rows || '<div class="empty">אין שידורים נוספים היום</div>')}
    </section>`;
  }
  box.innerHTML = html;
}

function renderAll(){
  const now = new Date();
  renderPrime(now);
  renderRest(now);
  document.getElementById('restRange').textContent = `${hhmm(now)} – 24:00`;
}

/* ===== טעינה ===== */
async function load(){
  const now = new Date();
  const p = ilParts(now);
  const dateStr = `${p.y}-${p.mo}-${p.d}`;
  todayEnd   = ilToDate(p.y,p.mo,p.d+1,0,0).getTime();                  // חצות הלילה הקרוב
  primeStart = ilToDate(p.y,p.mo,p.d, PRIME_FROM/60|0, PRIME_FROM%60);  // 21:00 היום
  primeEnd   = ilToDate(p.y,p.mo,p.d, PRIME_TO/60|0,   PRIME_TO%60);    // 23:00 היום

  document.getElementById('subtitle').textContent =
    new Intl.DateTimeFormat('he-IL',{timeZone:TZ,weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(now);

  const results = await Promise.all(CHANNELS.map(async ch=>{
    try{ return {ch, shows: await fetchChannel(ch,dateStr)}; }
    catch(e){ return {ch, shows:[], error:e.message}; }
  }));
  state = results;

  const failed = results.filter(r=>r.error);
  document.getElementById('error').innerHTML = failed.length
    ? `<div class="err">לא הצלחתי לטעון ${failed.length} ערוצים (${failed.map(f=>f.ch.num).join(', ')}). ייתכן שאין חיבור לאינטרנט או שהשירות חסום זמנית.</div>`
    : '';
  renderAll();
}

/* ===== אירועים ===== */
document.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  filter = b.dataset.filter;
  renderAll();
}));
/* פתיחה/סגירה – מטופל ישירות על ה‑DOM כדי שהאנימציה תרוץ ולא נאבד גלילה */
document.getElementById('prime').addEventListener('click', e=>{
  const spot = e.target.closest('.spot');
  if(spot){
    spotlight.set(spot.dataset.ch, spot.dataset.k);
    openCards.add(spot.dataset.ch);        // הכרטיס נשאר פתוח אחרי ההחלפה
    renderPrime(new Date());
    return;
  }
  const toggle = e.target.closest('.more-toggle');
  if(toggle){
    const card = toggle.closest('.card'), id = toggle.dataset.ch;
    const isOpen = !openCards.has(id);
    isOpen ? openCards.add(id) : openCards.delete(id);
    card.classList.toggle('open', isOpen);
    toggle.querySelector('.lbl').textContent = isOpen ? 'הסתר' : toggle.dataset.label;
    return;
  }
  const btn = e.target.closest('.read-more');
  if(btn){
    const txt = btn.previousElementSibling, k = btn.dataset.k;
    const isOpen = !openDescs.has(k);
    isOpen ? openDescs.add(k) : openDescs.delete(k);
    txt.classList.toggle('open', isOpen);
    btn.textContent = isOpen ? 'הצג פחות' : 'קרא עוד';
  }
});

document.getElementById('refresh').addEventListener('click', load);
document.getElementById('newsToggle').addEventListener('click', e=>{
  showNews = !showNews;
  e.target.textContent = showNews ? 'הסתר חדשות' : 'הצג גם חדשות';
  e.target.style.color = showNews ? 'var(--txt)' : '';
  renderAll();
});

setInterval(()=>{ document.getElementById('clock').textContent = hhmm(new Date()); }, 1000);
document.getElementById('clock').textContent = hhmm(new Date());
setInterval(()=>{ if(state.length) renderAll(); }, 60*1000);   // רענון תצוגה כל דקה
setInterval(load, 5*60*1000);                                  // משיכת נתונים כל 5 דקות
load();
</script>
